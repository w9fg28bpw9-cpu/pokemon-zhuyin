<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幼兒寶可夢注音學習與配對遊戲</title>
<style>
:root{--ink:#28445b;--blue:#8fd3f4;--blue2:#eaf8ff;--cream:#fffdf5;--red:#ef5350;--yellow:#ffd95c;--shadow:0 6px 18px rgba(45,84,110,.12)}
*{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#f7fcff,#fffaf1);min-height:100vh}
.wrap{width:min(1180px,96vw);margin:auto;padding:18px 0 36px}
.hero{text-align:center;padding:8px 10px 12px}.hero h1{margin:4px 0;font-size:clamp(24px,4vw,40px);letter-spacing:.04em}.hero p{margin:8px auto 0;max-width:820px;line-height:1.65;color:#527087}
.controls{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:12px;border:2px solid #cdeefe;border-radius:18px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);box-shadow:var(--shadow);margin-bottom:18px}
.controls label{font-weight:800}.controls input{width:92px;padding:10px 12px;border:2px solid #b8dff2;border-radius:12px;font-size:18px;text-align:center}
button{border:0;border-radius:14px;padding:11px 15px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:.15s transform,.15s filter}
button:active{transform:translateY(2px);box-shadow:none}.random{background:#69c8f0;color:#083a54}.stars{background:#ffd85d;color:#5c4500}.print{background:#dce8ef;color:#304b5e}
.status{text-align:center;margin:6px 0 14px;font-weight:800;color:#567}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;min-width:0;background:rgba(255,255,255,.96);border:2px dashed #9bcde5;border-radius:20px;padding:10px 10px 13px;box-shadow:var(--shadow);break-inside:avoid;display:flex;flex-direction:column;align-items:center}
.num{align-self:flex-start;font-size:12px;font-weight:900;color:#789}
.poke-img{width:100%;aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(0,0,0,.08))}
.fallback{width:100%;aspect-ratio:1/1;display:none;place-items:center;border-radius:16px;background:radial-gradient(circle at 50% 44%,#fff 0 24%,#e8f7ff 25% 48%,#d7effb 49%);font-size:clamp(36px,6vw,68px)}
.name{font-size:clamp(18px,2.2vw,27px);font-weight:1000;letter-spacing:.06em;text-align:center;margin:3px 0 8px;min-height:1.4em}
.zhuyin{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.zy-tag{background:#fff;border:2px solid #a9d9ef;color:#235773;border-radius:9px;padding:4px 6px;font-weight:900;line-height:1.05;min-width:34px;text-align:center;font-size:clamp(14px,1.8vw,20px)}
.badge{position:absolute;right:9px;top:9px;z-index:2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;border:4px solid #fff;box-shadow:0 2px 8px rgba(180,35,35,.28);font-size:26px;font-weight:1000}
.match-mode .card{cursor:pointer}.card.selected{outline:5px solid rgba(255,216,93,.9)}.card.matched{opacity:.5;transform:scale(.98)}
.footer-note{text-align:center;margin:18px 10px 0;font-size:13px;color:#718696}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wrap{width:97vw}.card{border-radius:16px;padding:8px}.controls{position:static}.badge{width:42px;height:42px;font-size:23px}}
@page{size:A4 portrait;margin:8mm}
@media print{
 body{background:#fff}.wrap{width:100%;padding:0}.hero p,.controls,.status,.footer-note{display:none!important}.hero{padding:0 0 4mm}.hero h1{font-size:18pt;margin:0}
 .grid{grid-template-columns:repeat(4,1fr);gap:3mm}.card{box-shadow:none;border:1.4pt dashed #8fbfd4;border-radius:4mm;padding:2.2mm;min-height:61mm}
 .poke-img,.fallback{height:34mm;width:100%;aspect-ratio:auto}.name{font-size:12pt;margin:1mm 0 1.5mm}.zy-tag{font-size:8.5pt;padding:1mm 1.3mm;min-width:9mm;border-width:1pt}.badge{width:10mm;height:10mm;font-size:15pt;border-width:1.5pt;right:2mm;top:2mm}.num{font-size:7.5pt}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>🌟 幼兒寶可夢注音學習卡</h1>
    <p>看寶可夢、認中文字、逐字讀注音。按「隨機產生 12 隻」可每天換題；按「37 音全覽」可一次複習 ㄅ～ㄦ。</p>
  </section>

  <div class="controls">
    <label>最高編號 <input id="maxNo" type="number" min="12" max="1025" value="200" inputmode="numeric"></label>
    <button class="random" id="randomBtn">🎲 隨機產生 12 隻</button>
    <button class="stars" id="zhuyinBtn">⭐ 注音代表（37音全覽）</button>
    <button class="print" onclick="window.print()">🖨️ A4 列印</button>
  </div>
  <div class="status" id="status"></div>
  <main class="grid" id="grid"></main>
  <div class="footer-note">寶可夢圖片網址採 assets.pokemon.com 圖鑑格式；若圖片無法載入會自動顯示 fallback。注音採逐字分組顯示。No.501～1025 名稱會在首次抽到時讀取繁體中文圖鑑資料並快取於瀏覽器。</div>
</div>

const grid=document.getElementById("grid"), status=document.getElementById("status"), maxNo=document.getElementById("maxNo");

const NEW_CACHE_KEY="pokemonZhuyinNameCache_v2";
let NEW_CACHE={};
try{ NEW_CACHE=JSON.parse(localStorage.getItem(NEW_CACHE_KEY)||"{}")||{}; }catch(e){ NEW_CACHE={}; }

async function resolvePokemon(no){
  if(DB[no]) return DB[no];
  if(NEW_CACHE[no]){
    const c=NEW_CACHE[no];
    return {no, name:c.name, zhuyin:splitZhuyin(no,c.name).join(" ")};
  }
  try{
    const r=await fetch(`https://pokeapi.co/api/v2/pokemon-species/${no}/`,{cache:"force-cache"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    const zh = data.names?.find(x=>x.language?.name==="zh-Hant")
            || data.names?.find(x=>x.language?.name==="zh-Hans")
            || data.names?.find(x=>x.language?.name==="zh-Hant-TW");
    const name = zh?.name || `寶可夢 ${String(no).padStart(3,"0")}`;
    NEW_CACHE[no]={name};
    try{localStorage.setItem(NEW_CACHE_KEY,JSON.stringify(NEW_CACHE));}catch(e){}
    return {no,name,zhuyin:splitZhuyin(no,name).join(" ")};
  }catch(e){
    return {no,name:`寶可夢 ${String(no).padStart(3,"0")}`,zhuyin:"寶 可 夢"};
  }
}

function imgUrl(no){return `https://assets.pokemon.com/assets/cms2/img/pokedex/full/${String(no).padStart(3,"0")}.png`}

function cardHTML(p,badge=""){
 const readings=p.zhuyin.split(/\s+/);
 return `<article class="card">
   ${badge?`<div class="badge">${badge}</div>`:""}
   <div class="num">No.${String(p.no).padStart(3,"0")}</div>
   <img class="poke-img" src="${imgUrl(p.no)}" alt="${p.name}" loading="lazy"
    onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
   <div class="fallback" aria-label="圖片載入失敗">⚪<small style="font-size:.23em;position:absolute;margin-top:72px">No.${p.no}</small></div>
   <div class="name">${p.name}</div>
   <div class="zhuyin">${readings.map(x=>`<span class="zy-tag">[ ${x} ]</span>`).join("")}</div>
 </article>`;
}
function render(list,mode){
 grid.innerHTML=list.map(x=>cardHTML(x.p,x.badge||"")).join("");
 status.textContent=mode==="rep" ? "⭐ 37 音代表全覽：ㄅ ～ ㄦ" : `🎲 本次隨機題目：${list.map(x=>"No."+x.p.no).join("、")}`;
}
async function random12(){
 let max=Math.max(12,Math.min(1025,Number(maxNo.value)||200)); maxNo.value=max;
 const set=new Set(); while(set.size<12)set.add(1+Math.floor(Math.random()*max));
 status.textContent="🎲 正在準備本次 12 隻寶可夢…";
 const nums=[...set];
 const mons=await Promise.all(nums.map(resolvePokemon));
 render(mons.map(p=>({p})),"random");
}
function showRep(){
 render(REP.map(([b,no,name,zy])=>({badge:b,p:{no,name,zhuyin:zy}})),"rep");
}
document.getElementById("randomBtn").addEventListener("click",random12);
document.getElementById("zhuyinBtn").addEventListener("click",showRep);
maxNo.addEventListener("change",()=>{maxNo.value=Math.max(12,Math.min(1025,Number(maxNo.value)||200))});
random12();
</script>
